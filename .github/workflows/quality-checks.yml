name: Portfolio quality checks

on:
  push:
    branches: [main, updated-portfolio]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-and-serve:
    name: Build, test, and serve production artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build production artifact
        run: npm run build

      - name: Serve and smoke-test production artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory build >/tmp/portfolio-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/tmp/portfolio-index.html; then
              grep -q '<title>' /tmp/portfolio-index.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=high
