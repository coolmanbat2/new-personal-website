name: Rotate operations log

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operations-log-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rotate log when it reaches 30 days
        shell: bash
        run: |
          set -euo pipefail
          current="ops-log/current.md"

          if [[ ! -f "$current" ]]; then
            echo "No current operations log found; nothing to rotate."
            exit 0
          fi

          period_start="$(sed -n 's/^Period start: //p' "$current" | head -n 1)"
          if [[ -z "$period_start" ]]; then
            echo "Current log has no 'Period start:' line; refusing to rotate."
            exit 1
          fi

          period_start_epoch="$(date -u -d "$period_start" +%s)"
          now_epoch="$(date -u +%s)"
          age_days="$(( (now_epoch - period_start_epoch) / 86400 ))"

          if (( age_days < 30 )); then
            echo "Current log is ${age_days} days old; no rotation needed."
            exit 0
          fi

          archive="ops-log/archive/${period_start}.md"
          mkdir -p ops-log/archive
          if [[ -e "$archive" ]]; then
            echo "Archive already exists at $archive; refusing to overwrite."
            exit 1
          fi

          mv "$current" "$archive"
          new_start="$(date -u +%F)"
          {
            printf 'Period start: %s\n\n' "$new_start"
            printf '# Operations Log\n\n'
            printf 'Entries record repository-affecting agent actions without secrets or credentials.\n'
          } > "$current"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-log/current.md "$archive"
          git commit -m "Rotate operations log after 30 days"
          git push
